server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx does NOT merge add_header across levels: any location block below that sets its
    # own add_header (for Cache-Control) silently drops every header set here instead of
    # adding to it. So this map + the single "always" block below applies to every response
    # regardless of which location handles it, and the two Cache-Control locations only ever
    # add a header on top of that, never their own separate add_header line.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # robots.txt discourages crawling, but a search engine can still index a URL it finds
    # linked elsewhere without ever fetching it — this header is what actually keeps pages
    # (and, via the API's matching header, directly-linked receipt/photo uploads) out of results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Filenames are content-hashed by the Vite build, so a changed file always gets a new
    # URL — safe to cache indefinitely. index.html itself is explicitly excluded from this
    # block (matched by the location above instead) since it's the one file whose content
    # can change without its URL changing.
    location /static/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }
}

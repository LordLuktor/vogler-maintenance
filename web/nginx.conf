server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Filenames are content-hashed by the Vite build, so a changed file always gets a new
    # URL — safe to cache indefinitely. index.html itself is explicitly excluded from this
    # block (matched by the location above instead) since it's the one file whose content
    # can change without its URL changing.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
